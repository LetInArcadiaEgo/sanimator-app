<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="sAnimator" />
    <title>sAnimator</title>
    <link rel="icon" type="image/png" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <script type="module" crossorigin src="./app/index-DfVQCJVh.js"></script>
    <link rel="stylesheet" crossorigin href="./app/index-BEFS-oLc.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <div id="notices" class="notices" role="status"></div>

    <main>
      <section id="tab-characters" class="tab" hidden>
        <div class="cards">
          <div class="card">
            <label class="well" id="well-A">
              <input id="file-A" class="visually-hidden" type="file" accept="image/*" />
              <img id="img-A" alt="Portrait A" hidden />
              <span class="well-hint">Tap to pick a photo</span>
            </label>
            <label class="field">Name<input id="name-A" type="text" maxlength="12" autocomplete="off" autocapitalize="words" /></label>
            <label class="field">Color<input id="color-A" type="color" /></label>
          </div>
          <div class="card">
            <label class="well" id="well-B">
              <input id="file-B" class="visually-hidden" type="file" accept="image/*" />
              <img id="img-B" alt="Portrait B" hidden />
              <span class="well-hint">Tap to pick a photo</span>
            </label>
            <label class="field">Name<input id="name-B" type="text" maxlength="12" autocomplete="off" autocapitalize="words" /></label>
            <label class="field">Color<input id="color-B" type="color" /></label>
          </div>
        </div>
        <ul id="character-problems" class="issues"></ul>
      </section>

      <section id="tab-lines" class="tab tab-lines" hidden>
        <div class="row lines-bar">
          <span class="hint">Hold a face to speak a line. Tap it to type one.</span>
          <span class="spacer"></span>
          <span id="duration" class="readout" aria-label="Duration">0:00.0</span>
        </div>
        <ol id="thread" class="thread" aria-label="Lines"></ol>
        <p id="thread-empty" class="hint thread-empty" hidden>No lines yet.</p>
        <ul id="issues" class="issues"></ul>
        <details id="paste" class="menu">
          <summary>Paste a script</summary>
          <p class="hint">One line each, starting with A: or B: or a character's name.</p>
          <textarea id="paste-text" class="paste" rows="6" spellcheck="false" autocomplete="off" aria-label="Script to paste"></textarea>
          <ul id="paste-issues" class="issues"></ul>
          <button id="paste-add" type="button" class="btn">Add as typed lines</button>
        </details>

        <div class="recorder">
          <p id="lines-status" class="status" role="status"></p>
          <div class="faces">
            <button id="face-A" type="button" class="face">
              <img id="face-img-A" alt="" hidden />
              <span id="face-name-A" class="face-name">A</span>
              <span class="face-meter"><i id="face-level-A"></i></span>
            </button>
            <button id="mic-toggle" type="button" class="btn mic" aria-pressed="false">Mic off</button>
            <button id="face-B" type="button" class="face">
              <img id="face-img-B" alt="" hidden />
              <span id="face-name-B" class="face-name">B</span>
              <span class="face-meter"><i id="face-level-B"></i></span>
            </button>
          </div>
        </div>
      </section>

      <section id="tab-preview" class="tab">
        <div class="stage">
          <canvas id="preview" class="preview" width="1080" height="1920"></canvas>
        </div>

        <div class="transport">
          <button id="play" type="button" class="btn">Play</button>
          <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Frame" />
          <span id="time" class="readout">0:00.0 / 0:00.0</span>
          <label class="check"><input id="loop" type="checkbox" /> Loop</label>
        </div>

        <p id="sound-note" class="status sound-note" role="status" hidden></p>

        <div class="export">
          <div class="row">
            <button id="export" type="button" class="btn primary" disabled>Export</button>
            <button id="cancel" type="button" class="btn" hidden>Cancel</button>
            <button id="share" type="button" class="btn primary" hidden>Share</button>
            <a id="download" class="btn" hidden>Download</a>
          </div>
          <progress id="progress" max="1" value="0" hidden></progress>
          <p id="status" class="status" role="status"></p>
        </div>

        <details class="menu">
          <summary>Menu</summary>
          <button id="reset" type="button" class="btn danger">Reset project</button>
          <!-- Temporary: the phone test pages for the voice version. Remove with lab/ before v2 ships. -->
          <a id="lab-link" class="btn" href="./lab/index.html">Voice tests</a>
        </details>
      </section>
    </main>

    <nav class="tabs" aria-label="Sections">
      <button id="nav-characters" type="button" data-tab="characters">Characters</button>
      <button id="nav-lines" type="button" data-tab="lines">Lines</button>
      <button id="nav-preview" type="button" data-tab="preview" aria-current="page">Preview</button>
    </nav>

  </body>
</html>
