<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#141414" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="sAnimator" />
    <title>sAnimator</title>
    <link rel="icon" type="image/png" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />
    <script type="module" crossorigin src="./app/index-Dqsk9097.js"></script>
    <link rel="stylesheet" crossorigin href="./app/index-D6P9yb0m.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
  <body>
    <div id="notices" class="notices" role="status"></div>

    <main>
      <section id="tab-characters" class="tab" hidden>
        <div class="cards">
          <div class="card">
            <label class="well" id="well-A">
              <input id="file-A" class="visually-hidden" type="file" accept="image/*" />
              <img id="img-A" alt="Portrait A" hidden />
              <span class="well-hint">Tap to pick a photo</span>
            </label>
            <label class="field">Name<input id="name-A" type="text" maxlength="12" autocomplete="off" autocapitalize="words" /></label>
            <label class="field">Color<input id="color-A" type="color" /></label>
          </div>
          <div class="card">
            <label class="well" id="well-B">
              <input id="file-B" class="visually-hidden" type="file" accept="image/*" />
              <img id="img-B" alt="Portrait B" hidden />
              <span class="well-hint">Tap to pick a photo</span>
            </label>
            <label class="field">Name<input id="name-B" type="text" maxlength="12" autocomplete="off" autocapitalize="words" /></label>
            <label class="field">Color<input id="color-B" type="color" /></label>
          </div>
        </div>
        <ul id="character-problems" class="issues"></ul>
      </section>

      <section id="tab-script" class="tab tab-script" hidden>
        <div class="row script-bar">
          <button id="insert-A" type="button" class="btn">A:</button>
          <button id="insert-B" type="button" class="btn">B:</button>
          <span class="spacer"></span>
          <span id="duration" class="readout" aria-label="Duration">0:00.0</span>
        </div>
        <textarea id="script" class="script" spellcheck="false" autocomplete="off" autocorrect="off" aria-label="Script"></textarea>
        <ul id="issues" class="issues"></ul>
      </section>

      <section id="tab-preview" class="tab">
        <div class="stage">
          <canvas id="preview" class="preview" width="1080" height="1920"></canvas>
          <p id="tap-hint" class="tap-hint" hidden>tap for next line</p>
        </div>

        <div class="transport">
          <button id="play" type="button" class="btn">Play</button>
          <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Frame" />
          <span id="time" class="readout">0:00.0 / 0:00.0</span>
          <label class="check"><input id="loop" type="checkbox" /> Loop</label>
        </div>

        <div class="sliders">
          <label class="slider">
            <span>Speed</span>
            <input id="set-speedCps" type="range" />
            <output id="out-speedCps"></output>
          </label>
          <label class="slider">
            <span>Reading speed</span>
            <input id="set-readCps" type="range" />
            <output id="out-readCps"></output>
          </label>
          <label class="slider">
            <span>Gap</span>
            <input id="set-gapSec" type="range" />
            <output id="out-gapSec"></output>
          </label>
          <label class="slider">
            <span>Punctuation</span>
            <input id="set-punctMult" type="range" />
            <output id="out-punctMult"></output>
          </label>
        </div>

        <div class="row panel">
          <label class="check"><input id="tap-mode" type="checkbox" /> Set timing by tapping</label>
          <span class="spacer"></span>
          <button id="clear-holds" type="button" class="btn">Clear holds</button>
        </div>

        <div class="export">
          <div class="row">
            <button id="export" type="button" class="btn primary" disabled>Export</button>
            <button id="cancel" type="button" class="btn" hidden>Cancel</button>
            <button id="share" type="button" class="btn primary" hidden>Share</button>
            <a id="download" class="btn" hidden>Download</a>
          </div>
          <progress id="progress" max="1" value="0" hidden></progress>
          <p id="status" class="status" role="status"></p>
        </div>

        <details class="menu">
          <summary>Menu</summary>
          <button id="reset" type="button" class="btn danger">Reset project</button>
        </details>
      </section>
    </main>

    <nav class="tabs" aria-label="Sections">
      <button id="nav-characters" type="button" data-tab="characters">Characters</button>
      <button id="nav-script" type="button" data-tab="script">Script</button>
      <button id="nav-preview" type="button" data-tab="preview" aria-current="page">Preview</button>
    </nav>

  </body>
</html>
